<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · VoxAgent AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-mode" data-page="login">
<div class="bg-decoration"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grid"></div></div>

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:var(--space-5);">
  <div class="glass-panel" style="width:100%; max-width:400px; padding:var(--space-6, 40px) var(--space-5);">

    <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-2); margin-bottom:var(--space-5);">
      <div class="logo-icon" style="width:52px; height:52px; font-size:1.4rem;"><i class="fa-solid fa-headset"></i></div>
      <span class="logo-text" style="font-size:1.3rem;">Vox<span class="logo-accent">Agent</span></span>
      <p class="text-muted" id="formSubtitle" style="margin-top:4px; font-size:var(--fs-sm);">Log in to your AI agent dashboard</p>
    </div>

    <div style="display:flex; background:var(--input-bg); border:1px solid var(--border-glass); border-radius:var(--radius-full); padding:4px; margin-bottom:var(--space-5);">
      <button type="button" id="tabLogin" class="btn btn-primary" style="flex:1; border-radius:var(--radius-full);">Log In</button>
      <button type="button" id="tabRegister" class="btn btn-ghost" style="flex:1; border-radius:var(--radius-full);">Register</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" name="email" required autocomplete="email" placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-4" id="loginSubmitBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Log In
      </button>
    </form>

    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-input" name="full_name" required autocomplete="name" placeholder="Ada Lovelace">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" name="email" required autocomplete="email" placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-4" id="registerSubmitBtn">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script>
(function () {
  if (window.VoxAPI.isAuthenticated()) {
    window.location.href = 'dashboard.html';
    return;
  }

  const { toast } = window.VoxUtils;

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const subtitle = document.getElementById('formSubtitle');

  function showLogin() {
    loginForm.classList.remove('hidden');
    registerForm.classList.add('hidden');
    tabLogin.className = 'btn btn-primary';
    tabRegister.className = 'btn btn-ghost';
    tabLogin.style.borderRadius = 'var(--radius-full)';
    tabRegister.style.borderRadius = 'var(--radius-full)';
    subtitle.textContent = 'Log in to your AI agent dashboard';
  }

  function showRegister() {
    registerForm.classList.remove('hidden');
    loginForm.classList.add('hidden');
    tabRegister.className = 'btn btn-primary';
    tabLogin.className = 'btn btn-ghost';
    tabLogin.style.borderRadius = 'var(--radius-full)';
    tabRegister.style.borderRadius = 'var(--radius-full)';
    subtitle.textContent = 'Create your VoxAgent AI account';
  }

  tabLogin.addEventListener('click', showLogin);
  tabRegister.addEventListener('click', showRegister);

  function setBusy(btn, busy, label) {
    btn.disabled = busy;
    btn.innerHTML = busy
      ? '<i class="fa-solid fa-spinner fa-spin"></i> Please wait…'
      : label;
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginSubmitBtn');
    const original = '<i class="fa-solid fa-right-to-bracket"></i> Log In';
    const formData = new FormData(loginForm);
    setBusy(btn, true, original);
    try {
      await window.VoxAPI.login({
        email: formData.get('email'),
        password: formData.get('password'),
      });
      window.location.href = 'dashboard.html';
    } catch (err) {
      toast(err.message, 'error');
      setBusy(btn, false, original);
    }
  });

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerSubmitBtn');
    const original = '<i class="fa-solid fa-user-plus"></i> Create Account';
    const formData = new FormData(registerForm);
    setBusy(btn, true, original);
    try {
      await window.VoxAPI.register({
        email: formData.get('email'),
        password: formData.get('password'),
        full_name: formData.get('full_name'),
      });
      window.location.href = 'dashboard.html';
    } catch (err) {
      toast(err.message, 'error');
      setBusy(btn, false, original);
    }
  });
})();
</script>
</body>
</html>
