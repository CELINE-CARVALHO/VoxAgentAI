<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation · VoxAgent AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-mode" data-page="conversation">
<div class="bg-decoration"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grid"></div></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-headset"></i></div>
      <span class="logo-text">Vox<span class="logo-accent">Agent</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
      <a href="live-calls.html" class="sidebar-link"><i class="fa-solid fa-phone-volume"></i><span>Live Calls</span></a>
      <a href="call-logs.html" class="sidebar-link active"><i class="fa-solid fa-clock-rotate-left"></i><span>Call Logs</span></a>
      <a href="knowledge.html" class="sidebar-link"><i class="fa-solid fa-book"></i><span>Knowledge Base</span></a>
      <a href="analytics.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a>
      <div class="sidebar-divider"></div>
      <a href="settings.html" class="sidebar-link"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="pulse-dot"></span><span>AI Engine Online</span></div></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon sidebar-hamburger" id="sidebarHamburger" aria-label="Toggle sidebar" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
        <div><div class="topbar-title">Conversation</div><div class="topbar-subtitle" id="callRefLabel">—</div></div>
      </div>
      <div class="topbar-actions">
        <a href="call-logs.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Logs</a>
      </div>
    </header>

    <div class="page-content">
      <div class="call-meta-row" id="callMetaRow" style="display:grid; grid-template-columns:repeat(4,1fr); gap:var(--space-4);"></div>

      <div class="chart-card glass-panel" id="summaryCard" style="max-width:820px; margin:0 auto; width:100%; display:none;">
        <div class="chart-card-header"><h3><i class="fa-solid fa-wand-magic-sparkles"></i> AI Summary</h3></div>
        <p id="summaryText" style="color:var(--text-primary); padding:0 0 var(--space-2);"></p>
      </div>

      <div class="chart-card glass-panel" style="max-width:820px; margin:0 auto; width:100%;">
        <div class="chart-card-header"><h3>Transcript</h3></div>
        <div id="transcriptView" style="display:flex; flex-direction:column; gap:var(--space-4); padding:var(--space-4) 0;"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  if (!window.VoxAPI.isAuthenticated()) { window.location.href = 'login.html'; return; }

  const { formatDate, formatDuration, languageName, sentimentMeta, capitalize, toast, escapeHtml } = window.VoxUtils;
  const params = new URLSearchParams(window.location.search);
  const callId = params.get('id');

  if (!callId) {
    toast('No call ID provided.', 'error');
    return;
  }

  try {
    const call = await window.VoxAPI.getCall(callId);
    document.getElementById('callRefLabel').textContent = call.call_ref;

    document.getElementById('callMetaRow').innerHTML = `
      <div class="stat-card glass-panel"><div class="stat-label">Caller</div><div class="stat-value" style="font-size:var(--fs-lg);">${escapeHtml(call.caller_name || 'Unknown')}</div></div>
      <div class="stat-card glass-panel"><div class="stat-label">Status</div><div class="stat-value" style="font-size:var(--fs-lg);">${capitalize(call.status)}</div></div>
      <div class="stat-card glass-panel"><div class="stat-label">Duration</div><div class="stat-value" style="font-size:var(--fs-lg);">${formatDuration(call.duration_seconds)}</div></div>
      <div class="stat-card glass-panel"><div class="stat-label">Started</div><div class="stat-value" style="font-size:var(--fs-lg);">${formatDate(call.started_at)}</div></div>
    `;

    if (call.summary) {
      document.getElementById('summaryCard').style.display = '';
      document.getElementById('summaryText').textContent = call.summary;
    }

    const view = document.getElementById('transcriptView');
    view.innerHTML = call.transcripts.map((t) => {
      const isAi = t.speaker === 'ai';
      const sm = sentimentMeta(t.sentiment);
      return `
        <div style="display:flex; ${isAi ? '' : 'flex-direction:row-reverse;'} gap:var(--space-3); align-items:flex-start;">
          <div class="avatar-fallback" style="width:32px;height:32px;flex-shrink:0;background:${isAi ? 'linear-gradient(135deg, var(--accent-primary), var(--accent-blue))' : 'var(--input-bg)'};">
            <i class="fa-solid ${isAi ? 'fa-robot' : 'fa-user'}" style="font-size:12px;"></i>
          </div>
          <div class="glass-panel" style="padding:var(--space-3) var(--space-4); max-width:70%;">
            <p style="color:var(--text-primary); margin-bottom:4px;">${escapeHtml(t.text)}</p>
            <div class="text-muted" style="font-size:var(--fs-xs); display:flex; gap:var(--space-2);">
              <span>${languageName(t.language)}</span>
              ${t.sentiment ? `<span><i class="fa-solid ${sm.icon}"></i> ${sm.label}</span>` : ''}
              ${t.latency_ms ? `<span>${t.latency_ms}ms</span>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    toast(err.message, 'error');
  }
})();
</script>
</body>
</html>
