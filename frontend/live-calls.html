<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Calls · VoxAgent AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-mode" data-page="live-calls">
<div class="bg-decoration"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grid"></div></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-headset"></i></div>
      <span class="logo-text">Vox<span class="logo-accent">Agent</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
      <a href="live-calls.html" class="sidebar-link active"><i class="fa-solid fa-phone-volume"></i><span>Live Calls</span></a>
      <a href="call-logs.html" class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i><span>Call Logs</span></a>
      <a href="knowledge.html" class="sidebar-link"><i class="fa-solid fa-book"></i><span>Knowledge Base</span></a>
      <a href="analytics.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a>
      <div class="sidebar-divider"></div>
      <a href="settings.html" class="sidebar-link"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-status"><span class="pulse-dot"></span><span>AI Engine Online</span></div>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon sidebar-hamburger" id="sidebarHamburger" aria-label="Toggle sidebar" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
        <div><div class="topbar-title">Live Calls</div><div class="topbar-subtitle">Simulate a real-time conversation</div></div>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" id="themeToggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
        <div class="topbar-avatar"><div class="avatar-fallback">A</div></div>
      </div>
    </header>

    <div class="page-content">
      <div class="call-console glass-panel" style="display:flex; flex-direction:column; height:calc(100vh - 180px); max-width:820px; margin:0 auto; width:100%;">
        <div class="call-console-header" style="display:flex; align-items:center; justify-content:space-between; padding:var(--space-4) var(--space-5); border-bottom:1px solid var(--border-glass);">
          <div style="display:flex; align-items:center; gap:var(--space-3);">
            <div class="pulse-dot" id="callStatusDot" style="display:none;"></div>
            <span id="callStatusText">No active call</span>
          </div>
          <div id="callTimer" class="text-muted">00:00</div>
        </div>

        <div class="call-transcript" id="callTranscript" style="flex:1; overflow-y:auto; padding:var(--space-5); display:flex; flex-direction:column; gap:var(--space-4);">
          <div class="empty-state text-muted" id="callEmptyState" style="text-align:center; margin:auto;">
            <i class="fa-solid fa-phone" style="font-size:2rem; opacity:0.4;"></i>
            <p style="margin-top:var(--space-3);">Click "Start Call" to begin a simulated conversation with your AI agent.</p>
          </div>
        </div>

        <div class="call-input-row" style="display:flex; gap:var(--space-3); padding:var(--space-4) var(--space-5); border-top:1px solid var(--border-glass);">
          <button class="btn btn-primary" id="startCallBtn"><i class="fa-solid fa-phone"></i> Start Call</button>
          <input type="text" class="form-input hidden" id="messageInput" placeholder="Type what the caller says…">
          <button class="btn btn-secondary hidden" id="sendMessageBtn"><i class="fa-solid fa-paper-plane"></i></button>
          <button class="btn btn-danger hidden" id="endCallBtn"><i class="fa-solid fa-phone-slash"></i> End</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/calls.js"></script>
</body>
</html>
