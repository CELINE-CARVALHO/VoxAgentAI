<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings · VoxAgent AI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark-mode" data-page="settings">
<div class="bg-decoration"><div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div><div class="bg-grid"></div></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-headset"></i></div>
      <span class="logo-text">Vox<span class="logo-accent">Agent</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
      <a href="live-calls.html" class="sidebar-link"><i class="fa-solid fa-phone-volume"></i><span>Live Calls</span></a>
      <a href="call-logs.html" class="sidebar-link"><i class="fa-solid fa-clock-rotate-left"></i><span>Call Logs</span></a>
      <a href="knowledge.html" class="sidebar-link"><i class="fa-solid fa-book"></i><span>Knowledge Base</span></a>
      <a href="analytics.html" class="sidebar-link"><i class="fa-solid fa-chart-line"></i><span>Analytics</span></a>
      <div class="sidebar-divider"></div>
      <a href="settings.html" class="sidebar-link active"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
      <a href="profile.html" class="sidebar-link"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-status"><span class="pulse-dot"></span><span>AI Engine Online</span></div></div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-icon sidebar-hamburger" id="sidebarHamburger" aria-label="Toggle sidebar" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
        <div><div class="topbar-title">Settings</div><div class="topbar-subtitle">Configure your AI agent's behavior</div></div>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" id="themeToggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      </div>
    </header>

    <div class="page-content" style="max-width:640px;">
      <form id="settingsForm" class="glass-panel" style="padding:var(--space-5);">
        <div class="form-group">
          <label class="form-label">Agent Voice</label>
          <select class="form-select" name="voice">
            <option value="alloy">Alloy</option>
            <option value="verse">Verse</option>
            <option value="aria">Aria</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Default Language</label>
          <select class="form-select" name="default_language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="hi">Hindi</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Business Hours</label>
            <input type="text" class="form-input" name="business_hours" placeholder="09:00-18:00">
          </div>
          <div class="form-group">
            <label class="form-label">Escalation Email</label>
            <input type="email" class="form-input" name="escalation_email" placeholder="[email protected]">
          </div>
        </div>

        <div class="form-group" style="flex-direction:row; align-items:center; justify-content:space-between;">
          <label class="form-label" style="margin:0;">Enable Notifications</label>
          <label class="form-switch"><input type="checkbox" name="notifications_enabled"><span class="slider"></span></label>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4"><i class="fa-solid fa-floppy-disk"></i> Save Settings</button>
      </form>
    </div>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  if (!window.VoxAPI.isAuthenticated()) { window.location.href = 'login.html'; return; }

  const form = document.getElementById('settingsForm');
  const { toast } = window.VoxUtils;

  try {
    const { preferences } = await window.VoxAPI.getSettings();
    Object.entries(preferences || {}).forEach(([key, value]) => {
      const field = form.elements[key];
      if (!field) return;
      if (field.type === 'checkbox') field.checked = !!value;
      else field.value = value;
    });
  } catch (err) {
    toast(err.message, 'error');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const preferences = {
      voice: formData.get('voice'),
      default_language: formData.get('default_language'),
      business_hours: formData.get('business_hours'),
      escalation_email: formData.get('escalation_email'),
      notifications_enabled: form.elements['notifications_enabled'].checked,
    };
    try {
      await window.VoxAPI.updateSettings(preferences);
      toast('Settings saved', 'success');
    } catch (err) {
      toast(err.message, 'error');
    }
  });
})();
</script>
</body>
</html>
