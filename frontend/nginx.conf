server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;

    # Static assets: allow caching, but keep it short since this project
    # doesn't fingerprint filenames on build.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Lightweight endpoint for the container HEALTHCHECK below — avoids
    # depending on index.html specifically staying at "/".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
